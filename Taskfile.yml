# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  APP: web-note-server

silent: true
tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list-all
  dev:
    desc: Start development server, including backend and frontend
    deps: [dev-be, dev-fe]

  dev-be:
    desc: Start development server for backend
    cmds:
      - cargo run -p {{.APP}} --features swagger

  dev-fe:
    desc: Start development server for frontend
    cmds:
      - pnpm --dir web dev

  release:
    desc: Build and release binary
    aliases: [build]
    cmds:
      - task: openapi
      - cargo test
      - pnpm --dir web build
      - cargo build --release -p {{.APP}}

  openapi:
    desc: Generate OpenAPI specification schema
    sources:
      - crates/**/*.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - openapi.json
      - web/src/api/schema.d.ts
    cmds:
      - cargo run -p {{.APP}} -- --openapi > openapi.json.tmp
      - mv openapi.json.tmp openapi.json
      - pnpm --dir web exec biome format --write ../openapi.json
      - pnpm --dir web gen:api

  init:
    desc: Initialize project, install dependencies and setup git hooks
    aliases: [i]
    cmds:
      - pnpm --dir web install
      - lefthook install
